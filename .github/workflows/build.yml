name: Build

# Branches (see CONTRIBUTING.md): work happens in pull requests into "prep"; a release is a pull request
# from prep into "main".
# - Pull requests build and test, never for documentation alone; a new push stops the build still running.
# - Versions are MAJOR.MINOR.BUILD, worked out by scripts/version.sh from the newest release.
# - Every push to prep (a merged pull request) also publishes the "experimental" pre-release: the latest
#   test version, for testers to install, e.g. 0.1.140 (the newest release's 0.1, then the run number).
# - Every push to main (a merged release pull request) publishes the next release with the installer and
#   the zip: v0.1.0, then v0.2.0, and so on. VERSION holds only the major version (0 until 1.0).
# - Running the workflow by hand (Actions > Build > Run workflow) builds any branch; with a version such
#   as 0.2.0 it also publishes that release.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main, prep]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to release, such as 0.2.0 (leave empty for a test build only)'
        required: false
        default: ''

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  # A release (push to main) is never stopped halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          version="$(scripts/version.sh '${{ github.event_name }}' '${{ github.ref_name }}' '${{ github.run_number }}' "$RELEASE_VERSION")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

  core-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install ExifTool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      # The auto-tagging model (about 750 MB), so the tests run it on a real photo.
      - name: Cache tagging model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tag-model
          key: tag-model-siglip2-base-patch16-224-fp16-v1
      - name: Download tagging model
        run: |
          dir="$RUNNER_TEMP/tag-model"
          mkdir -p "$dir"
          base=https://huggingface.co/onnx-community/siglip2-base-patch16-224-ONNX/resolve/main
          for f in onnx/vision_model_fp16.onnx onnx/text_model_fp16.onnx tokenizer.model; do
            [ -f "$dir/$(basename $f)" ] || curl -sSfL --retry 3 -o "$dir/$(basename $f)" "$base/$f"
          done
          [ -f "$dir/cats.jpg" ] || curl -sSfL --retry 3 -o "$dir/cats.jpg" http://images.cocodataset.org/val2017/000000039769.jpg
          ls -l "$dir"
          echo "PHOTOGALLERY_TAG_MODEL=$dir" >> "$GITHUB_ENV"
      - name: Cache face models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/face-model
          key: face-model-yunet-sface-v1
      - name: Download face models and sample portraits
        run: |
          dir="$RUNNER_TEMP/face-model"
          mkdir -p "$dir"
          zoo=https://media.githubusercontent.com/media/opencv/opencv_zoo/47534e27c9851bb1128ccc0102f1145e27f23f98/models
          for f in face_detection_yunet/face_detection_yunet_2023mar.onnx face_recognition_sface/face_recognition_sface_2021dec.onnx; do
            [ -f "$dir/$(basename $f)" ] || curl -sSfL --retry 3 -o "$dir/$(basename $f)" "$zoo/$f"
          done
          for f in obama.jpg obama2.jpg biden.jpg two_people.jpg; do
            [ -f "$dir/$f" ] || curl -sSfL --retry 3 -o "$dir/$f" "https://raw.githubusercontent.com/ageitgey/face_recognition/master/examples/$f"
          done
          ls -l "$dir"
          echo "PHOTOGALLERY_FACE_MODEL=$dir" >> "$GITHUB_ENV"
      # The fast upscaling model (about 5 MB), so the tests scale a real picture up.
      - name: Download upscaling model
        run: |
          dir="$RUNNER_TEMP/upscale-model"
          mkdir -p "$dir"
          curl -sSfL --retry 3 -o "$dir/model.zip" https://qaihub-public-assets.s3.us-west-2.amazonaws.com/qai-hub-models/models/real_esrgan_general_x4v3/releases/v0.64.0/real_esrgan_general_x4v3-onnx-float.zip
          echo "fc094329b24a00c936ebc1cc4c51bc59633e7dc36f4a553344342171cbd3c7cf  $dir/model.zip" | sha256sum -c
          unzip -o -j -q "$dir/model.zip" '*.onnx' '*.data' -d "$dir"
          ls -l "$dir"
          echo "PHOTOGALLERY_UPSCALE_MODEL=$dir" >> "$GITHUB_ENV"
      - name: Test core library
        run: dotnet test tests/PhotoGallery.Core.Tests --logger "console;verbosity=normal"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download ExifTool
        shell: pwsh
        run: |
          ./scripts/Get-ExifTool.ps1
          "$PWD\tools\exiftool" | Out-File -FilePath $env:GITHUB_PATH -Append
      # The tagging model here too: ONNX Runtime on Windows loads it differently than on Linux.
      - name: Cache tagging model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tag-model
          key: tag-model-siglip2-base-patch16-224-fp16-v1
      - name: Download tagging model
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'tag-model'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $base = 'https://huggingface.co/onnx-community/siglip2-base-patch16-224-ONNX/resolve/main'
          foreach ($f in 'onnx/vision_model_fp16.onnx', 'onnx/text_model_fp16.onnx', 'tokenizer.model') {
            $target = Join-Path $dir (Split-Path $f -Leaf)
            if (-not (Test-Path $target)) { curl.exe -sSfL --retry 3 -o $target "$base/$f" }
          }
          $cats = Join-Path $dir 'cats.jpg'
          if (-not (Test-Path $cats)) { curl.exe -sSfL --retry 3 -o $cats http://images.cocodataset.org/val2017/000000039769.jpg }
          Get-ChildItem $dir
          "PHOTOGALLERY_TAG_MODEL=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Cache face models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/face-model
          key: face-model-yunet-sface-v1
      - name: Download face models and sample portraits
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'face-model'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $zoo = 'https://media.githubusercontent.com/media/opencv/opencv_zoo/47534e27c9851bb1128ccc0102f1145e27f23f98/models'
          foreach ($f in 'face_detection_yunet/face_detection_yunet_2023mar.onnx', 'face_recognition_sface/face_recognition_sface_2021dec.onnx') {
            $target = Join-Path $dir (Split-Path $f -Leaf)
            if (-not (Test-Path $target)) { curl.exe -sSfL --retry 3 -o $target "$zoo/$f" }
          }
          foreach ($f in 'obama.jpg', 'obama2.jpg', 'biden.jpg', 'two_people.jpg') {
            $target = Join-Path $dir $f
            if (-not (Test-Path $target)) { curl.exe -sSfL --retry 3 -o $target "https://raw.githubusercontent.com/ageitgey/face_recognition/master/examples/$f" }
          }
          Get-ChildItem $dir
          "PHOTOGALLERY_FACE_MODEL=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test core library
        run: dotnet test tests/PhotoGallery.Core.Tests --logger "console;verbosity=normal"
      - name: Build app (x64)
        # The Google Photos key comes from the repository's secrets; without them the app asks users for their own.
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        run: dotnet build src/PhotoGallery.App/PhotoGallery.App.csproj -c Release -p:Platform=x64 "-p:GoogleClientId=$env:GOOGLE_CLIENT_ID" "-p:GoogleClientSecret=$env:GOOGLE_CLIENT_SECRET" "-p:OneDriveClientId=$env:ONEDRIVE_CLIENT_ID" "-p:Version=$env:APP_VERSION"
      - name: Smoke test (start the app and check it stays up)
        shell: pwsh
        run: |
          $data = Join-Path $env:LOCALAPPDATA 'HolidayPhotoGallery'
          Remove-Item "$data\*.log" -ErrorAction SilentlyContinue
          # A library with the sample photos, so startup also loads, lists and indexes real files.
          $photos = Join-Path $env:RUNNER_TEMP 'SmokePhotos'
          New-Item -ItemType Directory -Force $photos, $data | Out-Null
          Copy-Item tests/PhotoGallery.Core.Tests/TestData/* $photos
          # Like a real library: a holiday subfolder that is also added on its own, next to its parent.
          $holiday = Join-Path $photos 'Costa Rica 2026'
          New-Item -ItemType Directory -Force $holiday | Out-Null
          # Several cameras and tags, so the camera and tag filters are rebuilt as on a real library.
          $jpg = 'tests/PhotoGallery.Core.Tests/TestData/sample.jpg'
          foreach ($i in 1..12) {
            $file = Join-Path $photos "camera$i.jpg"
            Copy-Item $jpg $file
            exiftool -q -overwrite_original "-Make=Maker$($i % 4)" "-Model=Model $($i % 4)" "-XMP-dc:Subject=Tag$($i % 3)" $file
          }
          # As many photos as a holiday, so the grid loads hundreds of thumbnails like on a user's PC.
          foreach ($i in 1..12) { foreach ($n in 1..40) { Copy-Item (Join-Path $photos "camera$i.jpg") (Join-Path $holiday "copy$i-$n.jpg") } }
          @{ Folders = @($holiday, $photos) } | ConvertTo-Json | Set-Content "$data\settings.json"
          $exe = Get-ChildItem src/PhotoGallery.App/bin/x64/Release -Recurse -Filter HolidayPhotoGallery.exe | Select-Object -First 1
          # Several starts, since the crash this guards against depends on timing; the first also fills the index.
          # A crash leaves a full dump (Windows Error Reporting), which the cdb debugger then explains;
          # attaching a debugger up front changes the timing so much that the crash no longer happens.
          $dumps = "$env:RUNNER_TEMP\dumps"
          New-Item -ItemType Directory -Force $dumps | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\HolidayPhotoGallery.exe'
          New-Item -Force $key | Out-Null
          Set-ItemProperty $key DumpFolder $dumps -Type ExpandString
          Set-ItemProperty $key DumpType 2 -Type DWord
          foreach ($run in 1..10) {
            $p = Start-Process $exe.FullName -PassThru
            Start-Sleep -Seconds 8
            if (-not $p.HasExited) {
              "Start $run`: app is running"
              Stop-Process -Id $p.Id -Force
              Start-Sleep -Seconds 2
              continue
            }
            "Start $run`: app exited with code $($p.ExitCode)"
            foreach ($log in Get-ChildItem $data -Filter *.log -ErrorAction SilentlyContinue) { "===== $($log.Name)"; Get-Content $log.FullName -Tail 120 }
            Start-Sleep -Seconds 10
            $dump = Get-ChildItem $dumps -Filter *.dmp | Sort-Object LastWriteTime | Select-Object -Last 1
            $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
            if ($dump -and (Test-Path $cdb)) {
              "===== crash analysis of $($dump.Name)"
              # The symbol path goes in -y: inside -c, .sympath would swallow the commands after it.
              $symbols = "srv*$env:RUNNER_TEMP\symbols*https://msdl.microsoft.com/download/symbols"
              $analysis = & $cdb -z $dump.FullName -lines -y $symbols -c ".reload; !analyze -v; q" 2>&1
              $analysis | Select-Object -Last 250
              # WinUI errors arrive as a "stowed" exception: list its stack with names, and its error record.
              if (($analysis -join "`n") -match 'dt (0x[0-9a-f]+) combase!STOWED_EXCEPTION_INFORMATION_V2 -r; dps (0x[0-9a-f]+) L(0x[0-9a-f]+)') {
                "===== stowed exception"
                & $cdb -z $dump.FullName -lines -y $symbols -c ".reload /f Microsoft.UI.Xaml.dll; .reload /f combase.dll; dt $($Matches[1]) combase!STOWED_EXCEPTION_INFORMATION_V2 -r; dps $($Matches[2]) L$($Matches[3]); q" 2>&1 | Select-Object -Last 160
              }
            } else {
              "No dump found in $dumps"
            }
            exit 1
          }
      - name: Upload app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HolidayPhotoGallery-win-x64
          path: src/PhotoGallery.App/bin/x64/Release/net10.0-windows10.0.19041.0/win-x64/
      # The Windows installer (Inno Setup, per-user, see installer/README.md).
      - name: Build installer
        shell: pwsh
        run: |
          # The animated pages need Inno Setup 6.7 or later (PNG images); the version is pinned by hash.
          $innoUrl = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $innoHash = '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732'
          Invoke-WebRequest $innoUrl -OutFile "$env:RUNNER_TEMP\innosetup.exe"
          if ((Get-FileHash "$env:RUNNER_TEMP\innosetup.exe" -Algorithm SHA256).Hash -ne $innoHash) { throw 'Inno Setup download does not match the pinned hash' }
          $innoDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Start-Process "$env:RUNNER_TEMP\innosetup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$innoDir" -Wait
          $iscc = Join-Path $innoDir 'ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup not installed in $innoDir" }
          # Artwork: the committed PNG layers become the bitmaps Setup draws with.
          python -m pip install --quiet pillow
          python installer/art/png2bmp.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = Resolve-Path src/PhotoGallery.App/bin/x64/Release/net10.0-windows10.0.19041.0/win-x64
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$source" "/DOutputDir=$PWD\installer-output" installer\HolidayPhotoGallery.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer-output
      # Installs silently, checks the app is in place and registered, then uninstalls again.
      - name: Test installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer-output -Filter *.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\HolidayPhotoGallery'
          if (-not (Test-Path "$dir\HolidayPhotoGallery.exe")) { throw "App not installed in $dir" }
          $entry = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty | Where-Object DisplayName -eq 'Holiday Photo Gallery'
          if (-not $entry) { throw 'No entry in Installed apps' }
          "Installed $($entry.DisplayVersion) in $dir"
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Holiday Photo Gallery.lnk'
          if (-not (Test-Path $shortcut)) { throw 'No Start menu entry' }
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller hands over to a copy of itself in Temp, so wait for the files to go.
          foreach ($i in 1..30) { if (-not (Test-Path "$dir\HolidayPhotoGallery.exe")) { break }; Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\HolidayPhotoGallery.exe") { throw 'Uninstall left the app behind' }
          if (Test-Path $shortcut) { throw 'Uninstall left the Start menu entry behind' }
          'Uninstalled cleanly'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: HolidayPhotoGallery-Setup-x64
          path: installer-output/*.exe

  # Publishes a release (push to main, or a version typed in by hand) or the experimental pre-release
  # (push to prep); see the top.
  release:
    if: (github.event_name == 'workflow_dispatch' && inputs.release_version != '') || github.event_name == 'push'
    needs: [version, core-tests-linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          version="$VERSION"
          # The file names stay the same for every release, so .../releases/latest/download/<name> always works.
          cp artifacts/HolidayPhotoGallery-Setup-x64/*.exe HolidayPhotoGallery-Setup-x64.exe
          (cd artifacts/HolidayPhotoGallery-win-x64 && zip -qr ../../HolidayPhotoGallery-win-x64.zip .)
          # The app checks its download against this before installing an update (GitHub's own asset digest
          # is checked too, when there is one).
          sha256sum HolidayPhotoGallery-Setup-x64.exe | cut -d' ' -f1 > HolidayPhotoGallery-Setup-x64.exe.sha256
          files="HolidayPhotoGallery-Setup-x64.exe HolidayPhotoGallery-Setup-x64.exe.sha256 HolidayPhotoGallery-win-x64.zip"
          if [ "$EVENT" = push ] && [ "$BRANCH" = prep ]; then
            # What's new since the previous experimental build, shown by the app's update banner.
            previous="$(git rev-list -n 1 experimental 2> /dev/null || true)"
            {
              echo "Test version $version, built from prep at ${{ github.sha }}. It may have bugs; for everyday use take the latest release."
              echo
              if [ -n "$previous" ]; then
                echo "What's new since the previous test version:"
                git log --no-merges --format='- %s' "$previous..${{ github.sha }}"
              fi
            } > notes.md
            # One rolling pre-release: the old one goes, the new one points at this commit.
            gh release delete experimental --yes --cleanup-tag > /dev/null 2>&1 || true
            gh release create experimental $files \
              --prerelease --target "${{ github.sha }}" --title "Holiday Photo Gallery $version (experimental)" \
              --notes-file notes.md
            exit 0
          fi
          if [ "$EVENT" = push ] && [ "$BRANCH" != main ]; then
            exit 0
          fi
          tag="v$version"
          if [ "$EVENT" = push ] && gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::Release $tag already exists."
            exit 1
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" $files \
              --target "${{ github.sha }}" --title "Holiday Photo Gallery $version" --generate-notes
          fi
