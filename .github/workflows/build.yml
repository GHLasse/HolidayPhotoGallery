name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install ExifTool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - name: Test core library
        run: dotnet test tests/PhotoGallery.Core.Tests --logger "console;verbosity=normal"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download ExifTool
        shell: pwsh
        run: |
          ./scripts/Get-ExifTool.ps1
          "$PWD\tools\exiftool" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Test core library
        run: dotnet test tests/PhotoGallery.Core.Tests --logger "console;verbosity=normal"
      - name: Build app (x64)
        run: dotnet build src/PhotoGallery.App/PhotoGallery.App.csproj -c Release -p:Platform=x64
      - name: Smoke test (start the app and check it stays up)
        shell: pwsh
        run: |
          $data = Join-Path $env:LOCALAPPDATA 'HolidayPhotoGallery'
          Remove-Item "$data\*.log" -ErrorAction SilentlyContinue
          # A library with the sample photos, so startup also loads, lists and indexes real files.
          $photos = Join-Path $env:RUNNER_TEMP 'SmokePhotos'
          New-Item -ItemType Directory -Force $photos, $data | Out-Null
          Copy-Item tests/PhotoGallery.Core.Tests/TestData/* $photos
          # Like a real library: a holiday subfolder that is also added on its own, next to its parent.
          $holiday = Join-Path $photos 'Costa Rica 2026'
          New-Item -ItemType Directory -Force $holiday | Out-Null
          # Several cameras and tags, so the camera and tag filters are rebuilt as on a real library.
          $jpg = 'tests/PhotoGallery.Core.Tests/TestData/sample.jpg'
          foreach ($i in 1..12) {
            $file = Join-Path $photos "camera$i.jpg"
            Copy-Item $jpg $file
            exiftool -q -overwrite_original "-Make=Maker$($i % 4)" "-Model=Model $($i % 4)" "-XMP-dc:Subject=Tag$($i % 3)" $file
          }
          # As many photos as a holiday, so the grid loads hundreds of thumbnails like on a user's PC.
          foreach ($i in 1..12) { foreach ($n in 1..40) { Copy-Item (Join-Path $photos "camera$i.jpg") (Join-Path $holiday "copy$i-$n.jpg") } }
          @{ Folders = @($holiday, $photos) } | ConvertTo-Json | Set-Content "$data\settings.json"
          $exe = Get-ChildItem src/PhotoGallery.App/bin/x64/Release -Recurse -Filter HolidayPhotoGallery.exe | Select-Object -First 1
          # Run under ProcDump: WinUI only tells a debugger why it crashes, and ProcDump prints that.
          Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile "$env:RUNNER_TEMP\procdump.zip"
          Expand-Archive "$env:RUNNER_TEMP\procdump.zip" "$env:RUNNER_TEMP\procdump" -Force
          # Several starts, since the crash depends on timing; the first one also fills the index.
          foreach ($run in 1..6) {
            $out = "$env:RUNNER_TEMP\procdump$run.txt"
            $pd = Start-Process "$env:RUNNER_TEMP\procdump\procdump64.exe" -ArgumentList '-accepteula', '-l', '-e', '-x', $env:RUNNER_TEMP, "`"$($exe.FullName)`"" -RedirectStandardOutput $out -PassThru -NoNewWindow
            Start-Sleep -Seconds 15
            $app = Get-Process HolidayPhotoGallery -ErrorAction SilentlyContinue
            if ($app) {
              "Start $run`: app is running"
              $app | Stop-Process -Force
              $pd | Wait-Process -Timeout 20 -ErrorAction SilentlyContinue
              Get-Process procdump64 -ErrorAction SilentlyContinue | Stop-Process -Force
              continue
            }
            "Start $run`: app crashed"
            $pd | Wait-Process -Timeout 20 -ErrorAction SilentlyContinue
            foreach ($log in Get-ChildItem $data -Filter *.log -ErrorAction SilentlyContinue) { "===== $($log.Name)"; Get-Content $log.FullName -Tail 40 }
            "===== ProcDump"
            Get-Content $out | Where-Object { $_.Trim() } | Select-Object -Last 150
            exit 1
          }
      - name: Upload app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HolidayPhotoGallery-win-x64
          path: src/PhotoGallery.App/bin/x64/Release/net10.0-windows10.0.19041.0/win-x64/
