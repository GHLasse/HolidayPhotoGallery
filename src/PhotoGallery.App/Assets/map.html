<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.20/leaflet-maplibre-gl.js"></script>
<style>
  html, body, #map { height: 100%; margin: 0; }
  body { font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; }
  #search { position: absolute; z-index: 1000; top: 10px; left: 54px; right: 10px; max-width: 360px; display: flex; gap: 4px; }
  #search input { flex: 1; padding: 6px 8px; border: 1px solid #8a8a8a; border-radius: 4px; font: inherit; font-size: 14px; }
  #search button { padding: 6px 10px; border: 1px solid #8a8a8a; border-radius: 4px; background: #fff; font: inherit; font-size: 14px; cursor: pointer; }
  #message { position: absolute; z-index: 1000; bottom: 24px; left: 10px; padding: 4px 8px; border-radius: 4px; background: rgba(255,255,255,.9); font-size: 13px; display: none; }
  #offline { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 14px; color: #555; }
</style>
</head>
<body>
<div id="map"></div>
<form id="search" autocomplete="off">
  <input id="query" type="search" placeholder="Find a place, e.g. Tortuguero">
  <button type="submit">Find</button>
</form>
<div id="message"></div>
<div id="offline">The map needs an internet connection.</div>
<script>
// The page talks to the app through WebView2 messages:
//   from the app: {type:"photos", photos:[{path,name,lat,lon}]}, {type:"selection", paths:[...], fit:true|false},
//                 {type:"pin", lat, lon} (lat null removes the pin), {type:"placing", on}
//   to the app:   {type:"ready"}, {type:"pin", lat, lon}, {type:"select", path, add}
const host = window.chrome && window.chrome.webview;
const send = message => host && host.postMessage(message);
const lang = new URLSearchParams(location.search).get("lang") || "en";

if (!window.L) {
  document.getElementById("offline").style.display = "flex";
  document.getElementById("search").style.display = "none";
} else {
  start();
}

function addBaseMap(map, osm) {
  const plain = () => L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: osm }).addTo(map);
  if (!L.maplibreGL || !window.maplibregl) { plain(); return; }
  try {
    const layer = L.maplibreGL({
      style: "https://tiles.openfreemap.org/styles/liberty",
      attribution: '<a href="https://openfreemap.org">OpenFreeMap</a> ' + osm,
    }).addTo(map);
    const gl = layer.getMaplibreMap();
    // The app's language first, then the name in Latin letters, then as written there.
    const code = lang.split("-")[0];
    const label = ["coalesce", ["get", "name:" + code], ["get", "name:latin"], ["get", "name"]];
    gl.on("style.load", () => {
      for (const l of gl.getStyle().layers) {
        if (l.type !== "symbol") continue;
        const field = gl.getLayoutProperty(l.id, "text-field");
        if (field && JSON.stringify(field).includes("name")) gl.setLayoutProperty(l.id, "text-field", label);
      }
    });
    // If the map's style hasn't loaded after a while (offline or blocked), use the plain map instead.
    let loaded = false;
    gl.once("style.load", () => loaded = true);
    setTimeout(() => {
      if (loaded) return;
      map.removeLayer(layer);
      plain();
    }, 10000);
  } catch (e) {
    plain();
  }
}

function start() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("view")); } catch (e) { }
  const map = L.map("map", { zoomControl: true, worldCopyJump: true, preferCanvas: true })
    .setView(saved ? [saved.lat, saved.lon] : [30, 10], saved ? saved.zoom : 2);
  // Labels in the app's language: OpenFreeMap's free map (no key) carries every place's name in many
  // languages, so a city in China reads "Chengdu" rather than 成都. Without WebGL or that map, the
  // standard OpenStreetMap map shows the names as written locally.
  const osm = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
  addBaseMap(map, osm);
  map.on("moveend", () => {
    const c = map.getCenter();
    try { localStorage.setItem("view", JSON.stringify({ lat: c.lat, lon: c.lng, zoom: map.getZoom() })); } catch (e) { }
  });

  const photoLayer = L.layerGroup().addTo(map);
  const markers = new Map();   // path -> circle marker
  let selected = new Set();
  let pin = null;

  const normal = { radius: 6, color: "#fff", weight: 1.5, fillColor: "#0067c0", fillOpacity: 0.9 };
  const highlighted = { radius: 9, color: "#fff", weight: 2, fillColor: "#e8590c", fillOpacity: 1 };

  function restyle() {
    for (const [path, marker] of markers) {
      const on = selected.has(path);
      marker.setStyle(on ? highlighted : normal);
      if (on) marker.bringToFront();
    }
  }

  function setPin(lat, lon, notify) {
    if (lat === null || lat === undefined) {
      if (pin) { map.removeLayer(pin); pin = null; }
      return;
    }
    if (!pin) {
      pin = L.marker([lat, lon], { draggable: true, autoPan: true, title: "Drag to move. Assign it to the selected photos with the button below the map." }).addTo(map);
      pin.on("dragend", () => { const p = pin.getLatLng(); send({ type: "pin", lat: p.lat, lon: p.lng }); });
    } else {
      pin.setLatLng([lat, lon]);
    }
    if (notify) send({ type: "pin", lat, lon });
  }

  // Off while browsing the whole map (Map workspace): there are no photos picked to place there.
  let placing = true;
  map.on("click", e => { if (placing) setPin(e.latlng.lat, e.latlng.lng, true); });

  function showMessage(text) {
    const box = document.getElementById("message");
    box.textContent = text;
    box.style.display = text ? "block" : "none";
  }

  // Place search through OpenStreetMap's Nominatim, one request per search as its usage policy asks.
  document.getElementById("search").addEventListener("submit", async e => {
    e.preventDefault();
    const q = document.getElementById("query").value.trim();
    if (!q) return;
    showMessage("Searching…");
    try {
      const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=" + encodeURIComponent(q) +
                  "&accept-language=" + encodeURIComponent(lang);
      const response = await fetch(url);
      const results = await response.json();
      if (!results.length) { showMessage("No place found for \"" + q + "\"."); return; }
      const r = results[0];
      if (r.boundingbox) {
        const b = r.boundingbox.map(Number);
        map.fitBounds([[b[0], b[2]], [b[1], b[3]]], { maxZoom: 16 });
      } else {
        map.setView([+r.lat, +r.lon], 15);
      }
      setPin(+r.lat, +r.lon, true);
      showMessage("");
    } catch (err) {
      showMessage("The place search did not work. Check the internet connection.");
    }
  });

  function fitSelection() {
    const points = [...selected].filter(p => markers.has(p)).map(p => markers.get(p).getLatLng());
    if (points.length === 1) map.setView(points[0], Math.max(map.getZoom(), 14));
    else if (points.length > 1) map.fitBounds(L.latLngBounds(points), { padding: [40, 40], maxZoom: 16 });
  }

  if (host) {
    host.addEventListener("message", e => {
      const m = e.data;
      if (m.type === "photos") {
        photoLayer.clearLayers();
        markers.clear();
        for (const p of m.photos) {
          // Clicking a photo selects it instead of moving the pin.
          const marker = L.circleMarker([p.lat, p.lon], { ...normal, bubblingMouseEvents: false }).bindTooltip(p.name);
          marker.on("click", ev => {
            send({ type: "select", path: p.path, add: ev.originalEvent.ctrlKey });
          });
          marker.addTo(photoLayer);
          markers.set(p.path, marker);
        }
        restyle();
        if (m.fitAll && markers.size)
          map.fitBounds(L.latLngBounds([...markers.values()].map(x => x.getLatLng())), { padding: [40, 40], maxZoom: 12 });
      } else if (m.type === "selection") {
        selected = new Set(m.paths);
        restyle();
        if (m.fit) fitSelection();
      } else if (m.type === "pin") {
        setPin(m.lat, m.lon, false);
      } else if (m.type === "placing") {
        placing = m.on;
        if (!placing) setPin(null);
      }
    });
  }
  send({ type: "ready" });
}
</script>
</body>
</html>
