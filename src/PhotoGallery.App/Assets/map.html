<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map</title>
<!-- Pinned by hash (integrity): if the CDN served anything else, the browser refuses it. When a version changes,
     work out the new hash from the npm package: openssl dgst -sha384 -binary FILE | openssl base64 -A -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.20/leaflet-maplibre-gl.js" integrity="sha384-9fwNQRJPT6L1x49HAfKyw8GVB2Mk5nMTugqwaVgpJbJC/JObdUDN6uqDIW6jGYpG" crossorigin="anonymous"></script>
<style>
  html, body, #map { height: 100%; margin: 0; }
  body { font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; }
  /* The controls look like the app's (Windows 11 Fluent): white for contrast over the map, rounded, a thin
     border, Segoe Fluent Icons and the app's accent colour, which the app sends ({type:"style"}). */
  :root { --accent: #0067c0; --on-accent: #fff; --stroke: rgba(0,0,0,.0578); --stroke-bottom: rgba(0,0,0,.1622);
          --text: #1b1b1b; --text-2: #5d5d5d; --icons: "Segoe Fluent Icons", "Segoe MDL2 Assets"; }
  /* Dark mode (the app sends it with its colours): the controls dark like the app's, the map itself unchanged. */
  :root.dark { --stroke: rgba(255,255,255,.07); --stroke-bottom: rgba(255,255,255,.05); --text: #fff; --text-2: #c5c5c5;
               --surface: #2c2c2c; --surface-hover: #333; --surface-pressed: #282828; }
  :root.dark .plain { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }
  :root.dark .leaflet-container { background: #1b2029; }
  :root.dark .leaflet-control-attribution { background: rgba(27,32,41,.8); color: #aab; }
  :root.dark .leaflet-control-attribution a { color: #9fc3ff; }
  /* The app's Assign bar floats over the bottom of the map: the credits, legend and messages sit above it. */
  .leaflet-bottom { bottom: var(--inset-bottom, 0px); }
  /* Beside the photos the side pane's switch floats over the top of the map: zoom and search start below it.
     --inset-left: how much of the map's left the app hides while the map grows or shrinks between the pane and the Map page. */
  @property --inset-top { syntax: "<length>"; inherits: true; initial-value: 0px; }
  @property --inset-left { syntax: "<length>"; inherits: true; initial-value: 0px; }
  @property --inset-bottom { syntax: "<length>"; inherits: true; initial-value: 0px; }
  .leaflet-top { top: var(--inset-top, 0px); }
  .leaflet-left { left: var(--inset-left, 0px); }
  /* The same length and curve as the app's own moves (MapPanel.MorphMs), easing in and out. */
  :root.morph { transition: --inset-top .3s, --inset-left .3s, --inset-bottom .3s; transition-timing-function: cubic-bezier(.4,0,.2,1); }
  :root.morph #legend { transition: bottom .3s cubic-bezier(.4,0,.2,1); }
  /* Small credits on one line where they fit, so the legend above them never covers them. */
  .leaflet-control-attribution { font-size: 10px; line-height: 1.4; }
  :root { --surface: #fff; --surface-hover: #f9f9f9; --surface-pressed: #f5f5f5; }
  .card { background: var(--surface); border: 1px solid var(--stroke); border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.16); }
  .ctl { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 32px; padding: 4px 11px;
         box-sizing: border-box; border: 1px solid var(--stroke); border-bottom-color: var(--stroke-bottom); border-radius: 4px;
         background: var(--surface); color: var(--text); font: inherit; font-size: 14px; cursor: pointer; }
  .ctl:hover { background: var(--surface-hover); }
  .ctl:active { background: var(--surface-pressed); color: var(--text-2); }
  .icon { font-family: var(--icons); font-size: 16px; line-height: 1; font-style: normal; }
  /* The search box is the app's own (WinUI AutoSuggestBox): one box, the magnifier inside it on the right. */
  #search { position: absolute; z-index: 1000; top: calc(var(--inset-top, 0px) + 10px); left: calc(var(--inset-left, 0px) + 56px); right: 10px; max-width: 360px; display: flex;
            border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,.16); }
  #search input { flex: 1; min-width: 0; height: 36px; padding: 0 40px 1px 11px; box-sizing: border-box; border: 1px solid var(--stroke);
                  border-bottom: 1px solid #868686; border-radius: 4px; background: var(--surface); color: var(--text); font: inherit; font-size: 14px; outline: none; }
  #search input:hover { background: var(--surface-hover); }
  #search input:focus { background: var(--surface); border-bottom: 2px solid var(--accent); padding-bottom: 0; }
  #search input::placeholder { color: var(--text-2); }
  #search input::-webkit-search-cancel-button { display: none; }
  #search button { position: absolute; right: 3px; top: 4px; width: 32px; height: 28px; padding: 0; border: none; border-radius: 4px;
                   background: transparent; color: var(--text-2); cursor: pointer; }
  #search button:hover { background: rgba(0,0,0,.04); color: var(--text); }
  /* Leaflet's + and − as the app's buttons. */
  .leaflet-touch .leaflet-bar, .leaflet-bar { border: 1px solid var(--stroke) !important; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.16); overflow: hidden; }
  .leaflet-bar a, .leaflet-touch .leaflet-bar a { width: 36px; height: 36px; line-height: 36px; color: var(--text); border-bottom: 1px solid var(--stroke);
                    font-family: var(--icons); font-size: 16px; font-weight: normal; }
  .leaflet-bar a, .leaflet-bar a.leaflet-disabled { background: var(--surface); }
  .leaflet-bar a:hover { background: var(--surface-hover); color: var(--text); }
  .leaflet-bar a.leaflet-disabled { color: var(--text-2); opacity: .5; }
  #legend { position: absolute; z-index: 1000; bottom: calc(var(--inset-bottom, 0px) + 30px); left: calc(var(--inset-left, 0px) + 10px); right: 10px; width: fit-content; padding: 4px 8px; font-size: 12px; color: var(--text); display: none; }
  #legend svg { vertical-align: middle; margin-right: 6px; }
  #message { position: absolute; z-index: 1000; bottom: calc(var(--inset-bottom, 0px) + 52px); left: calc(var(--inset-left, 0px) + 10px); padding: 4px 8px; border-radius: 4px; background: rgba(255,255,255,.9); font-size: 13px; display: none; }
  /* The picture box has a fixed size, so the bubble is laid out right before the picture arrives; the close
     button sits above it (it covered the picture, which stuck out on the right). */
  .leaflet-popup-content:has(.preview) { margin: 26px 12px 10px; }
  .preview { width: 240px; }
  .leaflet-popup-content-wrapper { border-radius: 8px; }
  .preview .pic { width: 240px; height: 180px; display: flex; align-items: center; justify-content: center; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
  .preview .pic img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; cursor: pointer; }
  .preview .name { margin-top: 4px; font-size: 12px; color: #555; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preview .row { display: flex; gap: 4px; margin-top: 6px; align-items: center; }
  .preview .row .count { flex: 1; text-align: center; font-size: 12px; color: #555; }
  .preview button { flex: none; }
  .preview .actions button { flex: 1; }
  #offline { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 14px; color: #555; }
</style>
</head>
<body>
<div id="map"></div>
<form id="search" autocomplete="off">
  <input id="query" type="search" placeholder="Find a place, e.g. Tortuguero">
  <button type="submit" id="findButton" title="Find"><i class="icon">&#xE721;</i></button>
</form>
<div id="message"></div>
<div id="legend" class="card"><svg width="28" height="6"><line x1="2" y1="3" x2="26" y2="3" stroke="#7a3fd1" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"></line></svg><span id="legendText"></span></div>
<div id="offline">The map needs an internet connection.</div>
<script>
// The page talks to the app through WebView2 messages:
//   from the app: {type:"photos", photos:[{path,name,lat,lon}]}, {type:"selection", paths:[...], fit:true|false},
//                 {type:"pin", lat, lon} (lat null removes the pin), {type:"placing", on},
//                 {type:"find", q} (search for a place and go to the first found), {type:"goto", index} (another one found)
//                 {type:"preview", path, src} (the picture of the photo clicked on the whole-library map)
//                 {type:"texts", open, show, of, map, satellite, labels} (the bubble's buttons and the map/satellite
//                 switch in the app's language; "of" is like "{0} of {1}")
//                 (also find, placeholder, searching, notFound, searchFailed, offline, drag, zoomIn, zoomOut)
//                 (also trackLine, routeLine: the legend under a drawn line; a track message's label replaces it)
//                 (also showSelected, showAll: the button under zoom out that brings the selected photos, or all, into view)
//                 {type:"style", accent, onAccent, dark} (dark: the night map and dark controls)
//                 {type:"insets", top, left, bottom, animate} (pixels of the map the app's floating controls or its clip cover;
//                 animate: glide there)
//                 {type:"anchor"} (the next resize keeps the bottom right corner still; a fit soon after only if needed,
//                 and a fit asked for before that resize is checked again once it has happened)
//                 {type:"settle"} (a move between the pane and the Map page has ended: the selected photos are brought
//                 back into sight if the move left them out of it)
//                 {type:"estimates", points:[{lat,lon,name}]} (red dots where photos without GPS probably were, G-3)
//   to the app:   {type:"ready"}, {type:"pin", lat, lon}, {type:"select", path, add}, {type:"places", q, names:[...]},
//                 {type:"open", path} (the picture or Open in the preview), {type:"show", path} (Show in library),
//                 {type:"pinmenu", x, y} (right-click on the pin: the app shows its menu at that point of the map)
//                 {type:"layers", mode, labels, tracks, canLabel} (what the map shows, at the start and after each change;
//                 the app's Map options menu sets them with the same message, canLabel left out)
//   (a track message from the app: {type:"track", lines:[[[lat,lon],...],...], route, fit, label})
const host = window.chrome && window.chrome.webview;
const send = message => host && host.postMessage(message);
// File names go into tooltips as text, never as HTML (Leaflet reads a string as HTML).
const textNode = text => document.createTextNode(text == null ? "" : String(text));
const query = new URLSearchParams(location.search);
const lang = query.get("lang") || "en";
// The app's Esri key (from the build server) for sharp satellite pictures; without it the satellite view uses
// Sentinel-2 cloudless, which is free but only 10 m per pixel.
const esriKey = query.get("esri") || "";

if (!window.L) {
  document.getElementById("offline").style.display = "flex";
  document.getElementById("search").style.display = "none";
} else {
  start();
}

// The street map. Returns {gl, plain, ready}: the MapLibre map once its style has loaded (null with the plain
// OpenStreetMap map instead), the plain map's layer, and a list of functions to run when either is in place.
function addBaseMap(map, osm) {
  const base = { gl: null, layer: null, plain: null, ready: [] };
  const plain = () => {
    base.gl = null;
    base.plain = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: osm, className: "plain" }).addTo(map);
    base.ready.forEach(f => f());
  };
  if (!L.maplibreGL || !window.maplibregl) { plain(); return base; }
  try {
    const layer = base.layer = L.maplibreGL({
      style: "https://tiles.openfreemap.org/styles/liberty",
      attribution: '<a href="https://openfreemap.org">OpenFreeMap</a> ' + osm,
    }).addTo(map);
    const gl = layer.getMaplibreMap();
    // The app's language first, then the name in Latin letters, then as written there.
    const code = lang.split("-")[0];
    const label = ["coalesce", ["get", "name:" + code], ["get", "name:latin"], ["get", "name"]];
    gl.on("style.load", () => {
      for (const l of gl.getStyle().layers) {
        if (l.type !== "symbol") continue;
        const field = gl.getLayoutProperty(l.id, "text-field");
        if (field && JSON.stringify(field).includes("name")) gl.setLayoutProperty(l.id, "text-field", label);
      }
      base.gl = gl;
      base.ready.forEach(f => f());
    });
    // If the map's style hasn't loaded after a while (offline or blocked), use the plain map instead.
    let loaded = false;
    gl.once("style.load", () => loaded = true);
    setTimeout(() => {
      if (loaded) return;
      map.removeLayer(layer);
      plain();
    }, 10000);
  } catch (e) {
    plain();
  }
  return base;
}

// Satellite pictures under the map's names, roads and borders. Esri World Imagery is sharp down to single
// houses but needs the app's key; Sentinel-2 cloudless by EOX (free for non-commercial use) shows 10 m per
// pixel, enough for coasts, rivers, fields and towns. Both are in WGS 84 like GPS and OpenStreetMap, so photos
// line up with them, in China too (Chinese maps shift everything by GCJ-02; these don't).
function imageryLayer(map) {
  const pane = map.createPane("imagery");
  pane.style.zIndex = 150;   // under the street map's pane (200), which then only draws the labels
  if (esriKey) {
    return L.tileLayer("https://ibasemaps-api.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}?token=" + encodeURIComponent(esriKey), {
      pane, maxZoom: 19, maxNativeZoom: 19,
      attribution: 'Powered by <a href="https://www.esri.com">Esri</a> | Esri, Maxar, Earthstar Geographics, and the GIS User Community',
    });
  }
  const eox = year => L.tileLayer("https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-" + year + "_3857/default/g/{z}/{y}/{x}.jpg", {
    pane, maxZoom: 19, maxNativeZoom: 14,
    attribution: '<a href="https://s2maps.eu">Sentinel-2 cloudless ' + year + '</a> by <a href="https://eox.at">EOX IT Services GmbH</a> (Contains modified Copernicus Sentinel data ' + year + ')',
  });
  const layer = eox(2024);
  // If this year's layer isn't there (yet or any more), the 2022 one is.
  let loaded = 0, failed = 0;
  layer.on("tileload", () => loaded++);
  layer.on("tileerror", () => {
    if (++failed < 4 || loaded > 0 || !map.hasLayer(layer)) return;
    layer.off("tileerror");
    const older = eox(2022);
    map.removeLayer(layer);
    older.addTo(map);
    layer.replacedBy = older;
  });
  return layer;
}

function start() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("view")); } catch (e) { }
  // Quarter zoom steps when fitting, so a set of photos fills the view snugly; no grey above the North Pole or below
  // the South Pole: the map never zooms out further than the world's height, nor pans past its top or bottom.
  const map = L.map("map", { zoomControl: true, worldCopyJump: true, preferCanvas: true, zoomSnap: 0.25,
                             maxBounds: [[-85.05, -1e5], [85.05, 1e5]], maxBoundsViscosity: 1 })
    .setView(saved ? [saved.lat, saved.lon] : [30, 10], saved ? saved.zoom : 2);
  // The app's controls float over the map (Map | Satellite and layers top right, the Assign bar at the bottom): zooming
  // to photos leaves room for them, and the legend and credits sit above the bar ({type:"insets"}).
  let insetBottom = 0, insetTop = 0, insetLeft = 0, morphTimer = 0;
  // The legend sits just above the credits, however many lines they wrap to in a narrow pane.
  function placeLegend() {
    const credits = document.querySelector(".leaflet-control-attribution");
    const legend = document.getElementById("legend");
    legend.style.bottom = (insetBottom + (credits ? credits.offsetHeight : 16) + 8) + "px";
  }
  map.on("resize", placeLegend);
  function fillHeight() {
    const h = map.getSize().y;
    if (h > 0) map.setMinZoom(Math.max(0, Math.ceil(Math.log2(h / 256) * 4) / 4));
  }
  fillHeight();
  map.on("resize", fillHeight);
  // When the app grows or shrinks the map between the side pane and the Map page ({type:"anchor"} first), what is in
  // the bottom right corner (the part both places share) stays put instead of the centre, and the vector map is
  // drawn at its new size straight away rather than a frame later (an empty frame looked like a stutter).
  // A fit asked for before that resize (the app's messages arrive before the page learns its new size) is checked
  // again after it: the corner kept still can push the selected photos out of the smaller map (Lasse 2026-11-08).
  let anchorNext = false, gentleUntil = 0, fitAfterResize = false;
  map.on("resize", e => {
    if (anchorNext && Date.now() < gentleUntil) {
      anchorNext = false;
      map.panBy([(e.oldSize.x - e.newSize.x) / 2, (e.oldSize.y - e.newSize.y) / 2], { animate: false });
      if (fitAfterResize) { fitAfterResize = false; fitSelection(true); }
    }
    if (base.layer && base.gl) {
      try { base.layer._update(); base.gl.redraw(); } catch (err) { }
    }
  });
  const pad = () => ({ paddingTopLeft: [40 + insetLeft, 100 + insetTop], paddingBottomRight: [40, 40 + insetBottom] });
  // The centre button's tooltips, in the app's language once its texts arrive.
  const texts0 = { showSelected: "Show the selected photos", showAll: "Show all photos" };
  // Fluent's plus and minus on the zoom buttons, like the app's own zoom.
  map.zoomControl._zoomInButton.firstChild.textContent = "\uE710";
  map.zoomControl._zoomOutButton.firstChild.textContent = "\uE738";
  // Labels in the app's language: OpenFreeMap's free map (no key) carries every place's name in many
  // languages, so a city in China reads "Chengdu" rather than 成都. Without WebGL or that map, the
  // standard OpenStreetMap map shows the names as written locally.
  const osm = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
  const base = addBaseMap(map, osm);
  const imagery = imageryLayer(map);
  let mode = "map", labels = true, tracks = true;
  try { const v = JSON.parse(localStorage.getItem("layers")); if (v) { mode = v.mode === "satellite" ? "satellite" : "map"; labels = v.labels !== false; tracks = v.tracks !== false; } } catch (e) { }
  // Over the satellite pictures the street map keeps only names, roads and borders (or nothing, without labels).
  const keepOnImagery = l => (l.type === "symbol" && !l.id.startsWith("poi")) || (l.type === "line" && /^(road|highway|bridge|tunnel|boundary)/.test(l.id));
  function showLayers() {
    const satellite = mode === "satellite";
    const shown = satellite ? (imagery.replacedBy || imagery) : null;
    for (const l of [imagery, imagery.replacedBy]) if (l && l !== shown && map.hasLayer(l)) map.removeLayer(l);
    if (shown && !map.hasLayer(shown)) shown.addTo(map);
    if (base.gl) {
      for (const l of base.gl.getStyle().layers) {
        // Labels off hides the names on the street map too; over the pictures it leaves them bare.
        const on = satellite ? labels && keepOnImagery(l) : labels || l.type !== "symbol";
        base.gl.setLayoutProperty(l.id, "visibility", on ? "visible" : "none");
      }
    } else if (base.plain) {
      if (satellite && map.hasLayer(base.plain)) map.removeLayer(base.plain);
      else if (!satellite && !map.hasLayer(base.plain)) base.plain.addTo(map);
    }
    try { localStorage.setItem("layers", JSON.stringify({ mode, labels, tracks })); } catch (e) { }
    // The app's Map options menu below the map shows the same choices.
    send({ type: "layers", mode, labels, tracks, canLabel: !!base.gl });
  }
  base.ready.push(showLayers);
  showLayers();

  // A night map in dark mode, like a navigation app: the street map's own colours swapped for dark ones (the plain
  // fallback map is inverted instead). Satellite pictures stay as they are. The day colours are kept to go back.
  let dark = false;
  const day = {};
  const night = { background: "#1b2029", land: "#222833", water: "#0e2436", park: "#1d2e24", building: "#2a303a",
                  road: "#363e4b", major: "#4a5568", boundary: "#6b7686", text: "#d5dae2", halo: "#10141a" };
  function paintNight() {
    const gl = base.gl;
    if (!gl) return;
    for (const l of gl.getStyle().layers) {
      const id = l.id;
      const set = (prop, value) => {
        const key = id + "|" + prop;
        if (!(key in day)) {
          if (!dark) return;
          day[key] = gl.getPaintProperty(id, prop);
        }
        try { gl.setPaintProperty(id, prop, dark ? value : day[key]); } catch (e) { }
      };
      // A patterned fill (wetland, marsh, ...) draws a light picture over its colour, so dark mode drops the
      // picture and keeps the dark colour underneath.
      const unpattern = prop => { if ((id + "|" + prop) in day || gl.getPaintProperty(id, prop)) set(prop, null); };
      if (l.type === "background") { set("background-color", night.background); unpattern("background-pattern"); }
      else if (l.type === "fill") {
        const colour = /water|ocean|lake|river/.test(id) ? night.water
                     : /park|wood|forest|grass|green|landcover|scrub|wetland|marsh|swamp|bog|farmland/.test(id) ? night.park
                     : /building/.test(id) ? night.building : night.land;
        set("fill-color", colour);
        unpattern("fill-pattern");
        if ((id + "|fill-outline-color") in day || gl.getPaintProperty(id, "fill-outline-color")) set("fill-outline-color", colour);
      }
      else if (l.type === "fill-extrusion") { set("fill-extrusion-color", night.building); unpattern("fill-extrusion-pattern"); }
      else if (l.type === "line")
        set("line-color", /water|river|stream|canal|waterway/.test(id) ? night.water
                        : /boundary|admin/.test(id) ? night.boundary
                        : /motorway|trunk|primary/.test(id) ? night.major : night.road);
      else if (l.type === "raster") set("raster-brightness-max", 0.35);
      else if (l.type === "symbol") { set("text-color", night.text); set("text-halo-color", night.halo); }
    }
  }
  base.ready.push(paintNight);
  map.on("moveend", () => {
    const c = map.getCenter();
    try { localStorage.setItem("view", JSON.stringify({ lat: c.lat, lon: c.lng, zoom: map.getZoom() })); } catch (e) { }
  });

  // A GPS track or the route between photos (G-4): a thin, see-through line under the photo dots, in a colour of
  // its own. Drawn as SVG in a pane below the dots' canvas, so it never covers them or takes their clicks.
  const trackPane = map.createPane("track");
  trackPane.style.zIndex = 390;
  trackPane.style.pointerEvents = "none";
  const trackRenderer = L.svg({ pane: "track" });
  const trackLayer = L.layerGroup().addTo(map);

  const photoLayer = L.layerGroup().addTo(map);
  // Suggested positions for photos without GPS: red until they are assigned, then they become photo dots.
  const estimateLayer = L.layerGroup().addTo(map);
  const estimated = { radius: 7, color: "#c42b1c", weight: 2, dashArray: "3 3", fillColor: "#e81123", fillOpacity: 0.35 };
  const markers = new Map();   // path -> circle marker
  let selected = new Set();
  let pin = null;

  const normal = { radius: 6, color: "#fff", weight: 1.5, fillColor: "#0067c0", fillOpacity: 0.9 };
  const highlighted = { radius: 9, color: "#fff", weight: 2, fillColor: "#e8590c", fillOpacity: 1 };

  function restyle() {
    for (const [path, marker] of markers) {
      const on = selected.has(path);
      marker.setStyle(on ? highlighted : normal);
      if (on) marker.bringToFront();
    }
  }

  // The app's pin (Fluent "location", filled) in the accent colour instead of Leaflet's blue marker.
  const pinIcon = L.divIcon({
    className: "", iconSize: [36, 36], iconAnchor: [18, 34],
    html: '<svg width="36" height="36" viewBox="0 0 20 20" style="filter: drop-shadow(0 1px 2px rgba(0,0,0,.4))">' +
          '<path fill="var(--accent)" stroke="#fff" stroke-width=".8" d="M5.05 4.05a7 7 0 1 1 9.9 9.9l-1.13 1.12-2.43 2.37a2 2 0 0 1-2.64.12l-.14-.12-2.04-1.99-1.52-1.5a7 7 0 0 1 0-9.9M10 6.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5"/></svg>'
  });

  function setPin(lat, lon, notify) {
    if (lat === null || lat === undefined) {
      if (pin) { map.removeLayer(pin); pin = null; }
      return;
    }
    if (!pin) {
      pin = L.marker([lat, lon], { draggable: true, autoPan: true, icon: pinIcon, title: texts.drag || "Drag to move. Assign it to the selected photos with the button below the map." }).addTo(map);
      pin.on("dragend", () => { const p = pin.getLatLng(); send({ type: "pin", lat: p.lat, lon: p.lng }); });
      // Right-click: the app shows its own menu there (Assign, Estimate from photos before and after, Remove location).
      pin.on("contextmenu", e => {
        if (e.originalEvent) L.DomEvent.stop(e.originalEvent);
        send({ type: "pinmenu", x: e.containerPoint.x, y: e.containerPoint.y });
      });
    } else {
      pin.setLatLng([lat, lon]);
    }
    if (notify) send({ type: "pin", lat, lon });
  }

  // Which way the camera looked (G-5): a cone at the one selected photo, turned by dragging the round handle at its
  // tip (Geosetter-style). A photo without a direction shows only a faint handle to the north, to set one.
  let heading = null;            // { lat, lon, deg } or null
  let headingCone = null, headingHandle = null;
  const headingReach = 70;       // pixels from the photo to the handle
  function coneIcon(deg) {
    return L.divIcon({
      className: "", iconSize: [140, 140], iconAnchor: [70, 70],
      html: '<svg width="140" height="140" viewBox="-70 -70 140 140" style="pointer-events:none;overflow:visible">' +
            '<g transform="rotate(' + deg + ')"><path d="M0 0 L-24 -66 A70 70 0 0 1 24 -66 Z" fill="var(--accent)" fill-opacity=".28" stroke="var(--accent)" stroke-width="1.5"/>' +
            '<line x1="0" y1="0" x2="0" y2="-66" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/></g></svg>'
    });
  }
  const handleIcon = set => L.divIcon({
    className: "", iconSize: [18, 18], iconAnchor: [9, 9],
    html: '<div style="width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5);background:' +
          (set ? 'var(--accent)' : 'rgba(128,128,128,.7)') + ';cursor:grab"></div>'
  });
  function handleAt(lat, lon, deg) {
    const o = map.latLngToContainerPoint([lat, lon]);
    const r = deg * Math.PI / 180;
    return map.containerPointToLatLng([o.x + headingReach * Math.sin(r), o.y - headingReach * Math.cos(r)]);
  }
  function bearingTo(lat, lon, to) {
    const o = map.latLngToContainerPoint([lat, lon]);
    const p = map.latLngToContainerPoint(to);
    return (Math.atan2(p.x - o.x, o.y - p.y) * 180 / Math.PI + 360) % 360;
  }
  function drawHeading() {
    if (headingCone) { map.removeLayer(headingCone); headingCone = null; }
    if (headingHandle) { map.removeLayer(headingHandle); headingHandle = null; }
    if (!heading || !placing) return;
    const { lat, lon, deg } = heading;
    const set = deg !== null && deg !== undefined;
    if (set) headingCone = L.marker([lat, lon], { icon: coneIcon(deg), interactive: false, keyboard: false, zIndexOffset: -500 }).addTo(map);
    headingHandle = L.marker(handleAt(lat, lon, set ? deg : 0), {
      icon: handleIcon(set), draggable: true, keyboard: false, zIndexOffset: 500,
      title: set ? (texts.direction || "Which way the camera looked. Drag to turn it.") : (texts.setDirection || "Drag to set which way the camera looked.")
    }).addTo(map);
    headingHandle.on("drag", e => {
      const deg = bearingTo(lat, lon, e.target.getLatLng());
      if (headingCone) headingCone.setIcon(coneIcon(deg));
      else headingCone = L.marker([lat, lon], { icon: coneIcon(deg), interactive: false, keyboard: false, zIndexOffset: -500 }).addTo(map);
    });
    headingHandle.on("dragend", e => {
      const deg = Math.round(bearingTo(lat, lon, e.target.getLatLng()) * 10) / 10;
      heading = { lat, lon, deg };
      drawHeading();
      send({ type: "direction", deg });
    });
  }
  map.on("zoomend", drawHeading);

  // Off while browsing the whole map (Map workspace): there are no photos picked to place there.
  let placing = true;
  map.on("click", e => { if (placing) setPin(e.latlng.lat, e.latlng.lng, true); });

  function showMessage(text) {
    const box = document.getElementById("message");
    box.textContent = text;
    box.style.display = text ? "block" : "none";
  }

  // Place search through OpenStreetMap's Nominatim, one request per search as its usage policy asks (no
  // search while typing). The app's own search box asks for it on the Map page, where this box is hidden.
  let found = [];
  async function findPlace(q) {
    q = (q || "").trim();
    if (!q) return;
    showMessage(texts.searching || "Searching…");
    try {
      const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q=" + encodeURIComponent(q) +
                  "&accept-language=" + encodeURIComponent(lang);
      const response = await fetch(url);
      found = await response.json();
      send({ type: "places", q, names: found.map(r => r.display_name) });
      if (!found.length) { showMessage(placing ? (texts.notFound || "No place found for “{0}”.").replace("{0}", q) : ""); return; }
      goTo(found[0]);
      showMessage("");
    } catch (err) {
      showMessage(texts.searchFailed || "The place search did not work. Check the internet connection.");
    }
  }

  function goTo(r) {
    if (!r) return;
    if (r.boundingbox) {
      const b = r.boundingbox.map(Number);
      map.fitBounds([[b[0], b[2]], [b[1], b[3]]], { maxZoom: 16 });
    } else {
      map.setView([+r.lat, +r.lon], 15);
    }
    if (placing) setPin(+r.lat, +r.lon, true);
  }

  document.getElementById("search").addEventListener("submit", e => {
    e.preventDefault();
    findPlace(document.getElementById("query").value);
  });

  // The part of the map really on screen: not what the app's floating controls cover, nor what it clips away while
  // the map grows or shrinks, with a little margin so a dot right at the edge counts as out of sight.
  function inSight(point) {
    const size = map.getSize(), at = map.latLngToContainerPoint(point), m = 20;
    return at.x >= insetLeft + m && at.x <= size.x - m && at.y >= insetTop + m && at.y <= size.y - insetBottom - m;
  }

  // onlyIfHidden: the map moves only if some selected photo is out of sight (after a move between the pane and the
  // Map page, so nothing jumps that need not). Right after such a move a plain fit does the same.
  function fitSelection(onlyIfHidden) {
    const points = [...selected].filter(p => markers.has(p)).map(p => markers.get(p).getLatLng());
    if (!points.length) return;
    if ((onlyIfHidden || Date.now() < gentleUntil) && points.every(inSight)) return;
    if (points.length === 1) {
      // Centred in the part of the map on screen, between the controls above and the bar below.
      const zoom = Math.max(map.getZoom(), 14);
      const shift = L.point((insetLeft) / 2, (insetTop - insetBottom) / 2);
      map.setView(map.unproject(map.project(points[0], zoom).subtract(shift), zoom), zoom);
    }
    else map.fitBounds(L.latLngBounds(points), { ...pad(), maxZoom: 16 });
  }

  // The button under zoom out: the selected photos back in view, or all the photos when none is selected.
  function showSelectedOrAll() {
    if ([...selected].some(p => markers.has(p))) fitSelection(false);
    else if (markers.size) map.fitBounds(L.latLngBounds([...markers.values()].map(x => x.getLatLng())), { ...pad(), maxZoom: 12 });
  }
  const centreButton = L.DomUtil.create("a", "leaflet-control-centre", map.zoomControl.getContainer());
  centreButton.href = "#";
  centreButton.setAttribute("role", "button");
  centreButton.textContent = "\uE81D";
  centreButton.title = texts0.showSelected;
  L.DomEvent.disableClickPropagation(centreButton);
  L.DomEvent.on(centreButton, "click", ev => { L.DomEvent.preventDefault(ev); showSelectedOrAll(); });
  function titleCentreButton() {
    centreButton.title = [...selected].some(p => markers.has(p)) ? texts0.showSelected : texts0.showAll;
  }

  // The picture of a photo clicked on the whole-library map, in a bubble above its dot, with Show in library
  // and Open. Where dots lie on top of each other, the bubble steps through all the photos there.
  let preview = null, previewPath = null, previewGroup = [], previewIndex = 0;
  let texts = { open: "Open", show: "Show in library", of: "{0} of {1}" };
  function button(text, onClick) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ctl";
    b.textContent = text;
    b.addEventListener("click", ev => { ev.stopPropagation(); onClick(); });
    return b;
  }
  function previewContent(src) {
    const p = previewGroup[previewIndex];
    const box = document.createElement("div");
    box.className = "preview";
    const pic = document.createElement("div");
    pic.className = "pic";
    if (src) {
      const img = document.createElement("img");
      img.src = src;
      img.title = p.name;
      img.addEventListener("click", () => send({ type: "open", path: p.path }));
      pic.appendChild(img);
    }
    box.appendChild(pic);
    const label = document.createElement("div");
    label.className = "name";
    label.textContent = p.name;
    box.appendChild(label);
    if (previewGroup.length > 1) {
      const row = document.createElement("div");
      row.className = "row";
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = texts.of.replace("{0}", previewIndex + 1).replace("{1}", previewGroup.length);
      row.append(button("‹", () => step(-1)), count, button("›", () => step(1)));
      box.appendChild(row);
    }
    const actions = document.createElement("div");
    actions.className = "row actions";
    actions.append(button(texts.show, () => send({ type: "show", path: p.path })), button(texts.open, () => send({ type: "open", path: p.path })));
    box.appendChild(actions);
    return box;
  }
  function step(by) {
    previewIndex = (previewIndex + by + previewGroup.length) % previewGroup.length;
    previewPath = previewGroup[previewIndex].path;
    preview.setContent(previewContent(null));
    send({ type: "select", path: previewPath, add: false });
  }
  // The photos whose dots lie within a few pixels of the clicked one, the clicked one first.
  function photosAt(p) {
    const here = map.latLngToContainerPoint(markers.get(p.path).getLatLng());
    const near = [];
    for (const [path, marker] of markers) {
      if (path !== p.path && map.latLngToContainerPoint(marker.getLatLng()).distanceTo(here) <= 6)
        near.push(marker.photo);
    }
    return [p, ...near];
  }
  function showPreview(p, at) {
    previewGroup = photosAt(p);
    previewIndex = 0;
    previewPath = p.path;
    preview = L.popup({ offset: [0, -4], maxWidth: 270, minWidth: 240, autoPanPadding: [20, 20] }).setLatLng(at).setContent(previewContent(null)).openOn(map);
  }

  if (host) {
    host.addEventListener("message", e => {
      const m = e.data;
      if (m.type === "photos") {
        photoLayer.clearLayers();
        markers.clear();
        for (const p of m.photos) {
          // Clicking a photo selects it instead of moving the pin.
          const marker = L.circleMarker([p.lat, p.lon], { ...normal, bubblingMouseEvents: false });
          marker.photo = p;
          // The name is attached on first hover: tens of thousands of tooltips up front slow the map down.
          marker.once("mouseover", () => marker.bindTooltip(textNode(p.name)).openTooltip());
          marker.on("click", ev => {
            send({ type: "select", path: p.path, add: ev.originalEvent.ctrlKey });
            // Over the whole library the photo itself shows above its dot; the app sends its picture.
            if (!placing) showPreview(p, marker.getLatLng());
          });
          marker.addTo(photoLayer);
          markers.set(p.path, marker);
        }
        restyle();
        titleCentreButton();
        if (m.fitAll && markers.size)
          map.fitBounds(L.latLngBounds([...markers.values()].map(x => x.getLatLng())), { ...pad(), maxZoom: 12 });
      } else if (m.type === "selection") {
        selected = new Set(m.paths);
        restyle();
        titleCentreButton();
        if (m.fit) {
          fitSelection(false);
          if (anchorNext && Date.now() < gentleUntil) fitAfterResize = true;
        }
      } else if (m.type === "pin") {
        setPin(m.lat, m.lon, false);
      } else if (m.type === "direction") {
        heading = m.lat === null || m.lat === undefined ? null : { lat: m.lat, lon: m.lon, deg: m.deg };
        drawHeading();
      } else if (m.type === "placing") {
        placing = m.on;
        if (!placing) setPin(null);
        drawHeading();
        // Over the whole library the app's search box finds places; beside the photos this one sets the pin.
        document.getElementById("search").style.display = placing ? "flex" : "none";
      } else if (m.type === "preview") {
        if (preview && preview.isOpen() && m.path === previewPath && m.src)
          preview.setContent(previewContent(m.src));
      } else if (m.type === "texts") {
        texts = m;
        if (m.find) document.getElementById("findButton").title = m.find;
        if (m.placeholder) document.getElementById("query").placeholder = m.placeholder;
        if (m.offline) document.getElementById("offline").textContent = m.offline;
        if (m.zoomIn) document.querySelector(".leaflet-control-zoom-in").title = m.zoomIn;
        if (m.zoomOut) document.querySelector(".leaflet-control-zoom-out").title = m.zoomOut;
        if (m.showSelected) texts0.showSelected = m.showSelected;
        if (m.showAll) texts0.showAll = m.showAll;
        titleCentreButton();
      } else if (m.type === "layers") {
        if (m.mode) mode = m.mode === "satellite" ? "satellite" : "map";
        if (typeof m.labels === "boolean") labels = m.labels;
        if (typeof m.tracks === "boolean") tracks = m.tracks;
        showLayers();
      } else if (m.type === "style") {
        document.documentElement.style.setProperty("--accent", m.accent);
        document.documentElement.style.setProperty("--on-accent", m.onAccent);
        document.documentElement.classList.toggle("dark", !!m.dark);
        if (dark !== !!m.dark) { dark = !!m.dark; paintNight(); }
      } else if (m.type === "anchor") {
        anchorNext = true;
        fitAfterResize = false;
        gentleUntil = Date.now() + 1500;
      } else if (m.type === "settle") {
        fitSelection(true);
      } else if (m.type === "insets") {
        // animate: the controls glide to their new places with the app's own (its Morph); otherwise they jump.
        const root = document.documentElement;
        clearTimeout(morphTimer);
        root.classList.toggle("morph", !!m.animate);
        if (!m.animate) void root.offsetWidth;
        insetBottom = m.bottom || 0;
        root.style.setProperty("--inset-bottom", insetBottom + "px");
        insetTop = m.top || 0;
        root.style.setProperty("--inset-top", insetTop + "px");
        insetLeft = m.left || 0;
        root.style.setProperty("--inset-left", insetLeft + "px");
        placeLegend();
        if (m.animate) morphTimer = setTimeout(() => root.classList.remove("morph"), 350);
      } else if (m.type === "estimates") {
        estimateLayer.clearLayers();
        for (const p of m.points)
          L.circleMarker([p.lat, p.lon], { ...estimated, bubblingMouseEvents: false }).bindTooltip(textNode(p.name)).addTo(estimateLayer);
        if (m.points.length > 1)
          map.fitBounds(L.latLngBounds(m.points.map(p => [p.lat, p.lon])), { ...pad(), maxZoom: 14 });
        else if (m.points.length === 1 && !map.getBounds().contains([m.points[0].lat, m.points[0].lon]))
          map.panTo([m.points[0].lat, m.points[0].lon]);
      } else if (m.type === "track") {
        trackLayer.clearLayers();
        const lines = (m.lines || []).filter(l => l.length > 1);
        // A small legend says what the line is: a recorded track (solid) or the photos joined in order (dashed).
        const legend = document.getElementById("legend");
        legend.style.display = lines.length ? "block" : "none";
        placeLegend();
        legend.querySelector("line").setAttribute("stroke-dasharray", m.route ? "6 6" : "");
        // The leg an estimate lies on comes with its own text: how far and how long apart its two ends are.
        document.getElementById("legendText").textContent = m.label ? m.label : m.route
          ? (texts.routeLine || "Your geotagged photos in the order taken")
          : (texts.trackLine || "GPS track");
        if (lines.length) {
          // One line per track, so a phone's and a watch's track of the same time aren't joined.
          const line = L.polyline(lines, {
            renderer: trackRenderer, interactive: false, color: dark ? "#b49af5" : "#7a3fd1", weight: m.label ? 4 : 3, opacity: m.label ? 0.85 : 0.55,
            dashArray: m.route ? "6 6" : null, lineCap: "round", lineJoin: "round",
          }).addTo(trackLayer);
          if (m.fit) map.fitBounds(line.getBounds(), { ...pad(), maxZoom: 15 });
        }
      } else if (m.type === "find") {
        findPlace(m.q);
      } else if (m.type === "goto") {
        goTo(found[m.index]);
      }
    });
  }
  send({ type: "ready" });
  showLayers();
}
</script>
</body>
</html>
